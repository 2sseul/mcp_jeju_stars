services:
  jeju-star-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etri-jejuax-jeju-star-mcp
    ports:
      - "${MCP_PORT:-11000}:${MCP_PORT:-11000}"
    volumes:
      - ./app.py:/app/app.py
      - ./modules:/app/modules
      # 판정이 읽는 정적 데이터. 읽기 전용으로 물린다.
      - ./data:/app/data:ro
      # 경로 지도(`/maps/{name}`)가 떨어지는 자리 — 쓰기 가능해야 한다.
      - ./outputs:/app/outputs
      # Open-Meteo 응답 캐시. 안 물리면 재시작마다 비어 외부 호출이 다시 나간다.
      - ./.cache:/app/.cache
    # 키(카카오·VWorld·기상청)는 이미지에 굽지 않고 여기서 환경변수로 넣는다.
    # `modules/env.py` 가 환경변수를 파일보다 먼저 본다.
    env_file:
      - .env
    environment:
      - MCP_PORT=${MCP_PORT:-11000}
      # 지도 주소의 겉면. ngrok 공개 URL 이 정해지면 그것으로 바꾼다
      # (0.0.0.0 은 브라우저가 열 수 있는 주소가 아니라 바인딩 주소와 따로 둔다).
      - MAP_BASE_URL=${MAP_BASE_URL:-http://127.0.0.1:11000}
    command: sh -c "python app.py --host 0.0.0.0 --port $${MCP_PORT}"
    restart: unless-stopped
    networks:
      - etri-jejuax-gateway-network    # NETWORK 생성이 필요합니다.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${MCP_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 개발한 MCP 서버를 인터넷에 노출시키기 위한 것. 공개 URL 은 http://localhost:4040
  # (ngrok 웹 인스펙터)에서 확인한다. 토큰은 .env 의 NGROK_AUTHTOKEN 이다.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: etri-jejuax-jeju-star-mcp-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "jeju-star-mcp-server:${MCP_PORT:-11000}"
      - "--log=stdout"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"    # ngrok 웹 인스펙터 (공개 URL 확인용)
    depends_on:
      - jeju-star-mcp-server
    networks:
      - etri-jejuax-gateway-network

networks:
  etri-jejuax-gateway-network:
    name: etri-jejuax-gateway-network
