[project]
name = "mcp-jeju-star"
version = "0.1.0"
description = "제주 밤하늘 관측 조건 판정 MCP 서버"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.14,<3",
    "langgraph>=1.2.9",
    "numpy>=2.5.1",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "skyfield>=1.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
scripts = ["tifffile>=2024.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = ["RUF046"]
